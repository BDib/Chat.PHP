services:
  app:
    build: .
    volumes:
      - .:/var/www/chat
      - ./db:/var/www/chat/db
    environment:
      - DB_DRIVER=sqlite
      - DB_PATH=db/chat.db
    depends_on:
      - web

  web:
    image: nginx:alpine
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/chat
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
